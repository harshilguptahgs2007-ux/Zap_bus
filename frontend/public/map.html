<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .custom-user-dot {
        width: 16px;
        height: 16px;
        background: #006a63;
        border: 3px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(0, 106, 99, 0.9);
      }
      .pulse-ring {
        position: absolute;
        width: 32px;
        height: 32px;
        top: -8px;
        left: -8px;
        border-radius: 50%;
        background: rgba(0, 106, 99, 0.35);
        animation: pulse 2s infinite ease-out;
      }
      @keyframes pulse {
        0% { transform: scale(0.5); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .ev-bus-pill {
        background: #006b2c;
        color: #ffffff;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        white-space: nowrap;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid rgba(255,255,255,0.4);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      var map = L.map('map', {
        center: [28.6139, 77.2090], // Delhi NCR (Mayur Vihar - CP Corridor)
        zoom: 12,
        zoomControl: false,
        attributionControl: false
      });

      // Standard OpenStreetMap Tile Layer - 100% Guaranteed Real Roads & Maps Without Watermarks
      var currentTileLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // User Marker (Mayur Vihar)
      var userIcon = L.divIcon({
        className: 'user-icon-wrap',
        html: '<div style="position:relative"><div class="pulse-ring"></div><div class="custom-user-dot"></div></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
      L.marker([28.6139, 77.2090], { icon: userIcon }).addTo(map)
        .bindPopup("<b>You (Mayur Vihar)</b><br>Delhi NCR Commuter Hub");

      // Live EV Buses
      var buses = [
        { name: "Route 347 (EV)", lat: 28.6289, lng: 77.3649, color: "#006b2c" },
        { name: "729-EV Express", lat: 28.4986, lng: 77.0878, color: "#005320" },
        { name: "Electric AC 54", lat: 28.5645, lng: 77.3344, color: "#006a63" }
      ];

      buses.forEach(function(b) {
        var icon = L.divIcon({
          className: 'bus-pin',
          html: '<div class="ev-bus-pill" style="background:' + b.color + '">⚡ ' + b.name + '</div>',
          iconSize: [120, 24],
          iconAnchor: [60, 12]
        });
        L.marker([b.lat, b.lng], { icon: icon }).addTo(map)
          .bindPopup("<b>" + b.name + "</b><br>Zero-Emission Electric Bus");
      });

      // Listen for messages from parent window
      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.action === 'recenter') {
          map.flyTo([28.6139, 77.2090], 13);
        } else if (e.data.action === 'toggleStyle') {
          var isOsm = currentTileLayer._url.indexOf('openstreetmap') !== -1;
          var nextUrl = isOsm
            ? "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"
            : "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
          map.removeLayer(currentTileLayer);
          currentTileLayer = L.tileLayer(nextUrl, { maxZoom: 17 }).addTo(map);
        }
      });

      setTimeout(function() {
        map.invalidateSize();
      }, 150);
    </script>
  </body>
</html>
